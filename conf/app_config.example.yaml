logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

# 元数据数据库：存放表、字段、指标等元数据
db_meta:
  host: localhost
  port: 3306
  user: data_agent
  password: change_me
  database: meta

# 数据仓库数据库：业务数据
db_dw:
  host: localhost
  port: 3306
  user: data_agent
  password: change_me
  database: dw

# 向量数据库
qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

# 文本向量化服务（text-embeddings-inference）
embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5

# 全文检索（字段取值召回）
es:
  host: localhost
  port: 9200
  index_name: data_agent

# 大模型配置，请填入你自己的 API Key
llm:
  model_name: deepseek-chat
  api_key: sk-your-api-key
